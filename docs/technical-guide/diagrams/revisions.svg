<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 560" role="img" aria-labelledby="title desc">
<title id="title">Concurrent edits preserve two heads of one logical object</title><desc id="desc">V0: original edition: Object O / content F0; V1: desktop edit: base=V0 / tag Utilities; V2: offline browser edit: base=V0 / favorite=true; V3: edit of V1: base=V1 / V2 still survives</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6e8079" stroke-width="1.5"/></marker></defs>
<rect width="840" height="560" rx="16" fill="#f6f8f4"/>
<style>text{font-family:system-ui,sans-serif}.title{font-size:18px;font-weight:650;fill:#22332c}.label{font-size:14px;font-weight:650;fill:#22332c}.detail{font-size:12px;fill:#53665d}.edge{font-size:11px;fill:#53665d;paint-order:stroke;stroke:#f6f8f4;stroke-width:7px;stroke-linejoin:round}</style>
<text class="title" x="28" y="34">Concurrent edits preserve two heads of one logical object</text>
<path d="M420,158 C420,199.0 210,199.0 210,240" fill="none" stroke="#6e8079" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M420,158 C420,199.0 630,199.0 630,240" fill="none" stroke="#6e8079" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M210,318 C210,359.0 210,359.0 210,400" fill="none" stroke="#6e8079" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="310" y="80" width="220" height="78" rx="10" fill="#ffffff" stroke="#cad6cc"/>
<text class="label" x="326" y="109">V0: original edition</text>
<text class="detail" x="326" y="129">Object O / content F0</text>
<rect x="100" y="240" width="220" height="78" rx="10" fill="#e3ece4" stroke="#cad6cc"/>
<text class="label" x="116" y="269">V1: desktop edit</text>
<text class="detail" x="116" y="289">base=V0 / tag Utilities</text>
<rect x="520" y="240" width="220" height="78" rx="10" fill="#e3ece4" stroke="#cad6cc"/>
<text class="label" x="536" y="269">V2: offline browser edit</text>
<text class="detail" x="536" y="289">base=V0 / favorite=true</text>
<rect x="100" y="400" width="220" height="78" rx="10" fill="#ffffff" stroke="#cad6cc"/>
<text class="label" x="116" y="429">V3: edit of V1</text>
<text class="detail" x="116" y="449">base=V1 / V2 still survives</text>
<text class="detail" x="28" y="520">After V1 and V2: both are heads. After V3: the heads are V3 and V2.</text>
<text class="detail" x="28" y="537">Neither timestamps nor upload order select a winner.</text>
</svg>