<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 660" role="img" aria-labelledby="title desc">
<title id="title">Password-derived access and randomly generated document keys</title><desc id="desc">Password + salt: Argon2id: 64-byte output; KEK: first 32 bytes: Opens password wrapper; Auth: last 32 bytes: HMAC -&gt; server credential; Random master key: Metadata and key wrappers; Random recovery key: Alternative master wrapper; Random file key: Encrypts one content stream; Content chunks: Fresh nonces; bound context</desc>
