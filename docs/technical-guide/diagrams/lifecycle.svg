<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img" aria-labelledby="title desc">
<title id="title">Locking invalidates ownership before waiting for work</title><desc id="desc">Unlocked session: Owns keys / store / model; Detach + new generation: Old results are stale; Cancel session context: Stop active operations; Wait for active work: Serialized work / network; Wipe and close resources: Keys / model / local store; Revoke remote session: Best effort; bounded attempt</desc>
