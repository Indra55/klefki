<text class="label" x="46" y="114">Unlocked session</text>
<text class="detail" x="46" y="134">Owns keys / store / model</text>
<rect x="310" y="85" width="220" height="78" rx="10" fill="#e3ece4" stroke="#cad6cc"/>
<text class="label" x="326" y="114">Detach + new generation</text>
<text class="detail" x="326" y="134">Old results are stale</text>
<rect x="590" y="85" width="220" height="78" rx="10" fill="#e3ece4" stroke="#cad6cc"/>
